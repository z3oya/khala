[workspace]
resolver = "3"
members = ["crates/khala-core", "crates/khala-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["z3oya"]

[workspace.dependencies]
khala-core = { path = "crates/khala-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
http-body-util = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
